name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: SDK + WDK
        shell: pwsh
        run: |
          $w = "winget install -e --accept-source-agreements --accept-package-agreements --disable-interactivity --override `"/features OptionId.DesktopCPPx64 /quiet /norestart`""
          Invoke-Expression "$w --id Microsoft.WindowsSDK.10.0.26100"
          Invoke-Expression "$w --id Microsoft.WindowsWDK.10.0.26100"
          $t = "C:\Program Files (x86)\Windows Kits\10\build\WindowsDriver.Common.targets"
          $h = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\ntddk.h"
          if (-not (Test-Path $t)) { Write-Host "::error::WDK targets absents"; exit 1 }
          if (-not (Test-Path $h)) { Write-Host "::error::WDK headers absents"; exit 1 }
          Write-Host "WDK OK"

      - name: Driver
        shell: pwsh
        run: |
          $msb = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msb driver\VnSpoofer.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:TargetPlatformVersion=10.0.26100.0 /m

      - name: KDU
        shell: pwsh
        run: |
          iwr https://github.com/hfiref0x/KDU/releases/latest/download/kdu.zip -OutFile kdu.zip
          Expand-Archive kdu.zip -DestinationPath kdu -Force
          Copy-Item (Get-ChildItem kdu -Recurse -Filter kdu.exe | Select-Object -First 1).FullName app\res\kdu.exe
          Copy-Item x64\Release\VnSpoofer.sys app\res\VnSpoofer.sys

      - name: App
        run: dotnet publish app\VnSpoofer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: VnSpoofer
          path: out/VnSpoofer.exe
