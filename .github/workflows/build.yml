name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $pat = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.*\km\ntddk.h"

          winget configure -f "https://raw.githubusercontent.com/microsoft/Windows-driver-samples/main/_wdk_utils/winget/configs/wdk-vsenterprise.dsc.yaml" --accept-configuration-agreements --disable-interactivity

          if (-not (Get-ChildItem $pat -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::configure KO, repli chocolatey"
            choco install windowsdriverkit10 -y --no-progress --ignore-checksums
          }

          $h = Get-ChildItem $pat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $h) { Write-Host "::error::WDK absent"; exit 1 }
          $v = $h.Directory.Parent.Name
          "WDKVER=$v" | Out-File $env:GITHUB_ENV -Append
          Write-Host "WDK $v pret"

      - name: Driver
        shell: pwsh
        run: |
          $msb = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msb driver\VnSpoofer.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off "/p:TargetPlatformVersion=$env:WDKVER" /m

      - name: KDU
        shell: pwsh
        run: |
          iwr https://github.com/hfiref0x/KDU/releases/latest/download/kdu.zip -OutFile kdu.zip
          Expand-Archive kdu.zip -DestinationPath kdu -Force
          Copy-Item (Get-ChildItem kdu -Recurse -Filter kdu.exe | Select-Object -First 1).FullName app\res\kdu.exe
          Copy-Item x64\Release\VnSpoofer.sys app\res\VnSpoofer.sys

      - name: App
        run: dotnet publish app\VnSpoofer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: VnSpoofer
          path: out/VnSpoofer.exe
