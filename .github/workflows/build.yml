name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Driver
        shell: pwsh
        run: pwsh -File driver\build.ps1

      - name: KDU
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app\res | Out-Null
          pwsh -File tools\build-kdu.ps1
          Copy-Item driver\VnSpoofer.sys app\res\VnSpoofer.sys
      - name: App
        run: dotnet publish app\VnSpoofer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: VnSpoofer
          path: out/VnSpoofer.exe
