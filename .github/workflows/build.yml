name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WDK
        shell: pwsh
        run: |
          $i = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          & $i modify --installPath $p --add Microsoft.VisualStudio.Workload.WindowsDriver --quiet --norestart
          & $i modify --installPath $p --add Microsoft.VisualStudio.Workload.VCTools --quiet --norestart
      - name: Driver
        run: msbuild driver\VnSpoofer.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: KDU
        shell: pwsh
        run: |
          iwr https://github.com/hfiref0x/KDU/releases/latest/download/kdu.zip -OutFile kdu.zip
          Expand-Archive kdu.zip -DestinationPath kdu -Force
          Copy-Item (Get-ChildItem kdu -Recurse -Filter kdu.exe | Select-Object -First 1).FullName app\res\kdu.exe
          Copy-Item x64\Release\VnSpoofer.sys app\res\VnSpoofer.sys
      - name: App
        run: dotnet publish app\VnSpoofer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VnSpoofer
          path: out/VnSpoofer.exe